name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aporia-loader.exe
            
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aporia-loader
            
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: aporia-loader
            
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: aporia-loader

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.platform.target }}
        override: true
        
    - name: Install dependencies (Linux)
      if: matrix.platform.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libssl-dev pkg-config
        
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build
      run: cargo build --release --target ${{ matrix.platform.target }}
      
    - name: Rename artifact
      shell: bash
      run: |
        cd target/${{ matrix.platform.target }}/release
        if [ -f "aporia-loader.exe" ]; then
          mv aporia-loader.exe aporia-loader-${{ matrix.platform.target }}.exe
        else
          mv aporia-loader aporia-loader-${{ matrix.platform.target }}
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: aporia-loader-${{ matrix.platform.target }}
        path: target/${{ matrix.platform.target }}/release/aporia-loader-*
        
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          aporia-loader-*/aporia-loader-*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
