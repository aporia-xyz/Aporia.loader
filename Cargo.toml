[package]
name = "aporia-loader"
version = "0.5.0"
edition = "2021"
authors = ["Aporia Team"]
description = "Cross-platform Minecraft Fabric Loader with GUI"

[dependencies]
# Webview
wry = "0.46"
tao = "0.30"

# HTTP/Download
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Filesystem
dirs = "6.0"

# Utils
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# GitHub API
octocrab = "0.38"

# Archive
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "aporia-loader"
path = "src/main.rs"
